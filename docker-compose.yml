services:
  dashboard:
    build: .
    env_file: .env
    environment:
      STORAGE_BACKEND: supabase
      TASK_QUEUE_BACKEND: celery
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build: .
    env_file: .env
    environment:
      STORAGE_BACKEND: supabase
      TASK_QUEUE_BACKEND: celery
    command: celery -A mailagent.worker worker --loglevel=info
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
