services:
  - type: web
    name: mailagent-public-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mailagent.dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: STORAGE_BACKEND
        value: sqlite
      - key: TASK_QUEUE_BACKEND
        value: local
      - key: DEMO_SQLITE_DB_PATH
        value: /tmp/mailagent-public-demo.db
      - key: DASHBOARD_ALLOWED_ORIGINS
        value: "*"
      - key: OPENROUTER_MODEL
        value: google/gemma-2-9b-it:free
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEMO_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DEMO_RESET_ENDPOINT_ENABLED
        value: "true"
