services:
  - type: web
    name: mailagent-public-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mailagent.dashboard.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: STORAGE_BACKEND
        value: sqlite
      - key: TASK_QUEUE_BACKEND
        value: local
      - key: DEMO_SQLITE_DB_PATH
        value: /tmp/mailagent-public-demo.db
      - key: MAILAGENT_ENCRYPTION_KEY
        sync: false
      - key: DASHBOARD_ALLOWED_ORIGINS
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-3.8-flash
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DEMO_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DEMO_RESET_ENDPOINT_ENABLED
        value: "false"
      # Real Gmail Integration (Set these in Render dashboard or blueprint)
      - key: DEMO_GMAIL_CLIENT_ID
        sync: false
      - key: DEMO_GMAIL_CLIENT_SECRET
        sync: false
      - key: DEMO_GMAIL_REDIRECT_URI
        value: https://mailagent-public-demo.onrender.com/auth/gmail/callback
      - key: DEMO_GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEMO_GMAIL_EMAIL
        sync: false
      # Required with DASHBOARD_API_TOKEN for owner-only OAuth endpoints.
      - key: DASHBOARD_USER_ID
        value: demo-owner
      - key: DASHBOARD_API_TOKEN
        sync: false
