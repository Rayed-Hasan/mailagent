services:
  - type: worker
    name: mailagent-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A mailagent.worker worker --loglevel=info --concurrency=2
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_AUTO_REPLIES_PER_HOUR
        value: 10
      - key: CONFIDENCE_THRESHOLD
        value: 0.85
      - key: DEFAULT_AUTONOMY_MODE
        value: approve
      - key: DELAY_SEND_SECONDS
        value: 60

  - type: web
    name: mailagent-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mailagent.dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DASHBOARD_PORT
        value: 10000

  - type: pserv
    name: mailagent-beat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A mailagent.worker beat --loglevel=info
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailagent-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: mailagent-redis
    databaseName: mailagent
    user: mailagent
